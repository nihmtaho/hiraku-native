<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lộ trình hiraku — Kanban</title>
<style>
:root{
  --paper:#F4F1EA;--surface:#FFFDF8;--ink:#16130F;--muted:#6B655C;--muted2:#575149;
  --line:#DED8CC;--soft:#E8E3D9;--ember:#FF4D2E;--blue:#3A6EA5;--amber:#A67C00;--green:#2F9E6F;
  --gate:#16130F;--gate-ink:#F4F1EA;
  --serif:Georgia,"Times New Roman",serif;
  --sans:"Helvetica Neue",Helvetica,Arial,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#15120E;--surface:#201C16;--ink:#F4F1EA;--muted:#A39C8F;--muted2:#B8B1A4;
    --line:#3B352B;--soft:#2A251E;--ember:#FF6A4F;--blue:#7FAEDD;--amber:#E0B13A;--green:#4FC38F;
    --gate:#F4F1EA;--gate-ink:#16130F;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#15120E;--surface:#201C16;--ink:#F4F1EA;--muted:#A39C8F;--muted2:#B8B1A4;
  --line:#3B352B;--soft:#2A251E;--ember:#FF6A4F;--blue:#7FAEDD;--amber:#E0B13A;--green:#4FC38F;
  --gate:#F4F1EA;--gate-ink:#16130F;color-scheme:dark;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--paper);color:var(--ink);font:14px/1.45 var(--sans)}
.app{height:100%;display:flex;flex-direction:column;min-height:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

.top{display:flex;flex-wrap:wrap;gap:12px 32px;align-items:flex-end;justify-content:space-between;padding:16px 20px 12px;border-bottom:1.5px solid var(--ink)}
h1{margin:0;font:400 28px/1.05 var(--serif);letter-spacing:-.02em}
.sub{margin:6px 0 0;max-width:58ch;color:var(--muted);font-size:13px}
.stats{display:flex;flex-wrap:wrap;row-gap:8px}
.stat{padding:0 16px;border-left:1px solid var(--line)}
.stat:first-child{padding-left:0;border-left:0}
.stat b{display:block;font:400 22px/1.1 var(--serif);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}

.bar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:10px 20px;border-bottom:1px solid var(--line)}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 14px;min-height:34px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--muted);background:transparent;border-radius:999px;padding:5px 12px;min-height:32px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
#q{border:1.5px solid var(--ink);border-radius:10px;background:var(--surface);padding:6px 10px;min-height:34px;width:200px}
.ghost{border:1px solid var(--muted);background:transparent;border-radius:999px;padding:5px 12px;min-height:32px}
@media (pointer:coarse){.seg button,.chip,.ghost,#q{min-height:44px}}

.board{flex:1;min-height:0;display:flex;gap:12px;overflow-x:auto;padding:14px 20px 16px;align-items:stretch}
.col{flex:0 0 300px;display:flex;flex-direction:column;min-height:0;background:var(--soft);border-radius:14px}
.colh{flex:none;padding:12px 14px 10px;border-bottom:1px solid var(--line)}
.colh h2{margin:0;font:400 19px/1.15 var(--serif);letter-spacing:-.01em}
.colh .m{margin:3px 0 0;font-size:12px;color:var(--muted2)}
.colb{flex:1;min-height:0;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px;border-radius:0 0 14px 14px}
.colb.over{outline:2px dashed var(--ink);outline-offset:-5px}
.empty{margin:8px 4px;color:var(--muted2);font-size:13px}

.gate{flex:0 0 36px;align-self:stretch;border:0;border-radius:10px;background:var(--gate);color:var(--gate-ink);writing-mode:vertical-rl;font:400 14px var(--serif);letter-spacing:.06em;padding:12px 0;white-space:nowrap;overflow:hidden}

.card{background:var(--surface);border:1.5px solid var(--ink);border-radius:12px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.card.rev{border-style:dashed}
.card.dn{opacity:.72}
.card.drag{opacity:.4}
.c1{display:flex;justify-content:space-between;gap:8px;font-size:12px}
.cid{font-weight:700;font-variant-numeric:tabular-nums}
.ceff{color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.ct{font-size:14px;line-height:1.35}
.meta{display:flex;flex-wrap:wrap;gap:4px}
.tag{display:inline-flex;align-items:center;font-size:11.5px;line-height:1.4;border:1px solid var(--muted);border-radius:999px;padding:1px 8px;background:transparent}
.tag.rev{border-style:dashed;border-color:var(--ink)}
.tag.blk{border:1.5px solid var(--ember)}
.st::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;border:1.5px solid var(--muted)}
.st-rd::before{border-color:var(--blue);background:linear-gradient(90deg,var(--blue) 50%,transparent 50%)}
.st-ip::before{border-color:var(--amber);background:var(--amber)}
.st-rv::before{border-color:var(--blue);border-radius:1px;transform:rotate(45deg)}
.st-dn::before{border-color:var(--green);background:var(--green)}

dialog{border:0;padding:0;margin:0 0 0 auto;height:100%;max-height:100%;width:min(460px,100%);max-width:100%;background:var(--surface);color:var(--ink);border-left:1.5px solid var(--ink);overflow-y:auto}
dialog::backdrop{background:rgba(22,19,15,.45)}
.sheet{padding:calc(18px + env(safe-area-inset-top,0px)) 22px calc(28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.shead{display:flex;align-items:center;gap:8px}
.shead .ghost{margin-left:auto}
.sheet h3{margin:0;font:400 22px/1.2 var(--serif);letter-spacing:-.01em}
dl{margin:0;display:grid;grid-template-columns:104px 1fr;gap:10px 12px}
dt{color:var(--muted);font-size:12.5px}
dd{margin:0}
select{width:100%;border:1.5px solid var(--ink);border-radius:10px;background:var(--surface);padding:6px 8px;min-height:36px}
.sheet ul{margin:0;padding-left:18px}
.sheet li{margin:3px 0}
.sheet h4{margin:4px 0 0;font:700 13px var(--sans)}
.fnd{font-variant-numeric:tabular-nums}

@media (max-width:640px){
  .top,.bar{padding-left:12px;padding-right:12px}
  .board{padding-left:12px;padding-right:12px}
  .col{flex-basis:272px}
}
@media (prefers-reduced-motion:no-preference){
  .card{transition:transform .12s ease}
  .card:hover{transform:translateY(-1px)}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div>
      <h1>Lộ trình hiraku</h1>
      <p class="sub">Kanban theo ROADMAP v1.10 và DECISIONS v1.9. Thẻ viền nét đứt là đề xuất từ đợt review ngày 29/10/2026, chưa nằm trong ROADMAP. Kéo thẻ giữa các cột hoặc mở thẻ để đổi mốc và trạng thái.</p>
    </div>
    <div class="stats" id="stats"></div>
  </header>
  <div class="bar">
    <div class="seg" role="group" aria-label="Kiểu xem">
      <button type="button" data-v="ms" aria-pressed="true">Theo mốc</button>
      <button type="button" data-v="st" aria-pressed="false">Theo trạng thái</button>
    </div>
    <div class="chips" id="chips" role="group" aria-label="Lọc theo loại"></div>
    <input id="q" type="search" placeholder="Tìm thẻ" aria-label="Tìm thẻ">
    <button type="button" class="ghost" id="reset">Đặt lại vị trí thẻ</button>
  </div>
  <main class="board" id="board" aria-label="Bảng kanban"></main>
</div>
<dialog id="dlg" aria-labelledby="dt"></dialog>

var cards=raw.map(function(r){
  var o=r[6]||{},e=r[5]||{};
  return {id:r[0],t:r[1],m:r[2],ty:r[3],s:r[4],d:e.d,w:e.w,x:e.x,
          dep:o.dep||[],ref:o.ref||"",note:o.note||"",blk:o.blk||"",f:[].concat(o.f||[])};
});
var byId={};cards.forEach(function(c){byId[c.id]=c;});
var MSK={},STK={};MS.forEach(function(m){MSK[m.k]=m;});ST.forEach(function(s){STK[s.k]=s;});

var KEY="hiraku-kanban-v1";
var S={view:"ms",types:{},q:"",ov:{}};
try{
  var j=JSON.parse(localStorage.getItem(KEY)||"null");
  if(j){S.view=j.view==="st"?"st":"ms";S.ov=(j.ov&&typeof j.ov==="object")?j.ov:{};}
}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify({view:S.view,ov:S.ov}));}catch(e){}}

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];});}
function fmt(n){return String(Math.round(n*100)/100).replace(".",",");}
function weeks(c){return c.d!=null?c.d/5:(c.w!=null?c.w:0);}
function eff(c){
  if(c.x)return c.x;
  if(c.d!=null)return fmt(c.d)+" ngày";
  if(c.w!=null)return fmt(c.w)+" tuần";
  return "";
}
function cur(c){
  var o=S.ov[c.id]||{};
  var r={};for(var k in c)r[k]=c[k];
  if(o.m&&MSK[o.m])r.m=o.m;
  if(o.s&&STK[o.s])r.s=o.s;
  return r;
}
function setOv(id,p){
  var base=byId[id],o=S.ov[id]||{};
  for(var k in p)o[k]=p[k];
  if(o.m===base.m)delete o.m;
  if(o.s===base.s)delete o.s;
  if(Object.keys(o).length)S.ov[id]=o;else delete S.ov[id];
  save();render();
}
function stTag(k){return '<span class="tag st st-'+k+'">'+STK[k].n+'</span>';}
function typeTag(c){return '<span class="tag'+(c.ty==="rev"?" rev":"")+'">'+TY[c.ty]+'</span>';}

function match(c){
  var any=false,k;for(k in S.types){if(S.types[k]){any=true;break;}}
  if(any&&!S.types[c.ty])return false;
  if(S.q){
    var h=(c.id+" "+c.t+" "+c.note+" "+c.ref).toLowerCase();
    if(h.indexOf(S.q)<0)return false;
  }
  return true;
}

function cardEl(c){
  var blk=(c.blk&&c.s!=="dn")?'<span class="tag blk">Bị chặn: '+esc(c.blk)+'</span>':"";
  var fs=c.f.map(function(f){return '<span class="tag fnd">'+f+'</span>';}).join("");
  var pos=S.view==="st"?'<span class="tag">'+esc(MSK[c.m].n.split(" ")[0])+'</span>':(c.s!=="bl"?stTag(c.s):"");
  return '<article class="card'+(c.ty==="rev"?" rev":"")+(c.s==="dn"?" dn":"")+'" draggable="true" tabindex="0" role="button" data-id="'+esc(c.id)+'" aria-label="'+esc(c.id+": "+c.t)+'">'+
    '<div class="c1"><span class="cid">'+esc(c.id)+'</span><span class="ceff">'+esc(eff(c))+'</span></div>'+
    '<div class="ct">'+esc(c.t)+'</div>'+
    '<div class="meta">'+typeTag(c)+pos+blk+fs+'</div></article>';
}
function colEl(k,name,lines,list){
  return '<section class="col" aria-label="'+esc(name)+'"><header class="colh"><h2>'+name+'</h2>'+
    lines.map(function(l){return '<p class="m">'+l+'</p>';}).join("")+
    '</header><div class="colb" data-k="'+k+'">'+
    (list.length?list.map(cardEl).join(""):'<p class="empty">Không có thẻ</p>')+'</div></section>';
}
function gateEl(g){
  return '<button type="button" class="gate" data-g="'+g.k+'" aria-label="'+esc(g.k+": "+g.short)+'">'+esc(g.k+" "+g.short)+'</button>';
}

var board=document.getElementById("board");
function render(){
  var all=cards.map(cur),vis=all.filter(match),html="";
  var sl=board.scrollLeft,pos={};
  Array.prototype.forEach.call(board.querySelectorAll(".colb"),function(e){pos[e.dataset.k]=e.scrollTop;});
  if(S.view==="ms"){
    MS.forEach(function(m){
      var g=GATES.filter(function(x){return x.before===m.k;})[0];
      if(g)html+=gateEl(g);
      var inCol=all.filter(function(c){return c.m===m.k;});
      var sum=inCol.reduce(function(a,c){return a+weeks(c);},0);
      var lines=[m.end?"Kết thúc ≈ "+m.end:"Chưa lập lịch"];
      lines.push(m.eff?"Khả dĩ "+m.eff+" tuần-người (khoảng "+m.rng+")":"Khoảng "+m.rng+" tuần-người");
      if(m.k!=="M4"&&sum)lines.push("Cộng từ thẻ: "+fmt(sum)+" tuần-người");
      lines.push(inCol.length+" thẻ");
      html+=colEl(m.k,esc(m.n),lines,vis.filter(function(c){return c.m===m.k;}));
    });
  }else{
    ST.forEach(function(s){
      var inCol=all.filter(function(c){return c.s===s.k;});
      var sum=inCol.reduce(function(a,c){return a+weeks(c);},0);
      var lines=[inCol.length+" thẻ"];
      if(sum)lines.push("Cộng từ thẻ: "+fmt(sum)+" tuần-người");
      html+=colEl(s.k,'<span class="st st-'+s.k+'">'+s.n+'</span>',lines,vis.filter(function(c){return c.s===s.k;}));
    });
  }
  board.innerHTML=html;
  board.scrollLeft=sl;
  Array.prototype.forEach.call(board.querySelectorAll(".colb"),function(e){e.scrollTop=pos[e.dataset.k]||0;});
  renderStats(all);
  Array.prototype.forEach.call(document.querySelectorAll(".seg button"),function(b){b.setAttribute("aria-pressed",String(b.dataset.v===S.view));});
}
function renderStats(all){
  var w=all.filter(function(c){return c.m!=="M4";}).reduce(function(a,c){return a+weeks(c);},0);
  var done=all.filter(function(c){return c.s==="dn";}).length;
  var wait=all.filter(function(c){return c.s==="rv";}).length;
  var blk=all.filter(function(c){return c.blk&&c.s!=="dn";}).length;
  var rev=all.filter(function(c){return c.ty==="rev";}).length;
  var items=[
    [all.length,"thẻ"],
    [fmt(w),"tuần-người cộng từ thẻ M0–MR (ROADMAP: 47)"],
    [done+"/"+all.length,"hoàn thành"],
    [wait,"chờ duyệt"],
    [blk,"bị chặn"],
    [rev,"đề xuất từ review"]
  ];
  document.getElementById("stats").innerHTML=items.map(function(i){
    return '<div class="stat"><b>'+i[0]+'</b><span>'+i[1]+'</span></div>';
  }).join("");
}

var chips=document.getElementById("chips");
function renderChips(){
  chips.innerHTML=Object.keys(TY).map(function(k){
    return '<button type="button" class="chip" data-t="'+k+'" aria-pressed="'+(!!S.types[k])+'">'+TY[k]+'</button>';
  }).join("");
}

var dlg=document.getElementById("dlg");
function opt(list,sel){
  return list.map(function(x){return '<option value="'+x.k+'"'+(x.k===sel?" selected":"")+'>'+esc(x.n)+'</option>';}).join("");
}
function openCard(id){
  var base=byId[id];if(!base)return;
  var c=cur(base);
  var fl=c.f.length?'<h4>Phát hiện từ review</h4><ul>'+c.f.map(function(f){return '<li><b class="fnd">'+f+'</b> '+esc(FIND[f]||"")+'</li>';}).join("")+'</ul>':"";
  dlg.dataset.id=id;
  dlg.innerHTML='<div class="sheet"><div class="shead"><span class="cid">'+esc(c.id)+'</span>'+typeTag(c)+
    '<button type="button" class="ghost" data-close>Đóng</button></div>'+
    '<h3 id="dt">'+esc(c.t)+'</h3><dl>'+
    '<dt>Trạng thái</dt><dd><select data-f="s" aria-label="Trạng thái">'+opt(ST,c.s)+'</select></dd>'+
    '<dt>Mốc</dt><dd><select data-f="m" aria-label="Mốc">'+opt(MS,c.m)+'</select></dd>'+
    (eff(c)?'<dt>Ước lượng</dt><dd>'+esc(eff(c))+'</dd>':"")+
    (c.blk?'<dt>Bị chặn bởi</dt><dd>'+esc(c.blk)+'</dd>':"")+
    (c.dep.length?'<dt>Phụ thuộc</dt><dd>'+esc(c.dep.join(", "))+'</dd>':"")+
    (c.ref?'<dt>Tham chiếu</dt><dd>'+esc(c.ref)+'</dd>':"")+
    (c.note?'<dt>Ghi chú</dt><dd>'+esc(c.note)+'</dd>':"")+
    '</dl>'+fl+'</div>';
  if(!dlg.open)dlg.showModal();
}
function openGate(k){
  var g=GATES.filter(function(x){return x.k===k;})[0];if(!g)return;
  dlg.dataset.id="";
  dlg.innerHTML='<div class="sheet"><div class="shead"><span class="cid">'+g.k+'</span>'+
    '<button type="button" class="ghost" data-close>Đóng</button></div>'+
    '<h3 id="dt">'+esc(g.short)+'</h3><dl><dt>Thời điểm</dt><dd>'+esc(g.date)+'</dd></dl>'+
    '<h4>Điều kiện qua cổng</h4><ul>'+g.cond.map(function(x){return '<li>'+esc(x)+'</li>';}).join("")+'</ul>'+
    (g.dec.length?'<h4>Quyết định phải chốt</h4><ul>'+g.dec.map(function(x){return '<li>'+esc(x)+'</li>';}).join("")+'</ul>':"")+'</div>';
  if(!dlg.open)dlg.showModal();
}

board.addEventListener("click",function(e){
  var g=e.target.closest(".gate");if(g){openGate(g.dataset.g);return;}
  var c=e.target.closest(".card");if(c)openCard(c.dataset.id);
});
board.addEventListener("keydown",function(e){
  if(e.key!=="Enter"&&e.key!==" ")return;
  var c=e.target.closest(".card");
  if(c){e.preventDefault();openCard(c.dataset.id);}
});
dlg.addEventListener("click",function(e){
  if(e.target===dlg||e.target.closest("[data-close]"))dlg.close();
});
dlg.addEventListener("change",function(e){
  var f=e.target.dataset&&e.target.dataset.f,id=dlg.dataset.id;
  if(!f||!id)return;
  var p={};p[f]=e.target.value;setOv(id,p);
});

board.addEventListener("dragstart",function(e){
  var c=e.target.closest(".card");if(!c)return;
  e.dataTransfer.setData("text/plain",c.dataset.id);
  e.dataTransfer.effectAllowed="move";
  c.classList.add("drag");
});
board.addEventListener("dragend",function(e){
  var c=e.target.closest(".card");if(c)c.classList.remove("drag");
  Array.prototype.forEach.call(board.querySelectorAll(".over"),function(b){b.classList.remove("over");});
});
board.addEventListener("dragover",function(e){
  var b=e.target.closest(".colb");if(!b)return;
  e.preventDefault();b.classList.add("over");
});
board.addEventListener("dragleave",function(e){
  var b=e.target.closest(".colb");
  if(b&&!b.contains(e.relatedTarget))b.classList.remove("over");
});
board.addEventListener("drop",function(e){
  var b=e.target.closest(".colb");if(!b)return;
  e.preventDefault();
  var id=e.dataTransfer.getData("text/plain");
  if(!byId[id])return;
  var p={};p[S.view==="ms"?"m":"s"]=b.dataset.k;setOv(id,p);
});

document.querySelector(".seg").addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;
  S.view=b.dataset.v;save();render();
});
chips.addEventListener("click",function(e){
  var b=e.target.closest(".chip");if(!b)return;
  S.types[b.dataset.t]=!S.types[b.dataset.t];renderChips();render();
});
document.getElementById("q").addEventListener("input",function(e){
  S.q=e.target.value.trim().toLowerCase();render();
});
document.getElementById("reset").addEventListener("click",function(){
  S.ov={};save();render();
});

renderChips();render();
})();
</script>
</body>
</html>
