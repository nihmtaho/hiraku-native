syntax = "proto3";

package hiraku.v1;

option go_package = "hiraku/core/gen/hirakuv1;hirakuv1";

enum Method {
  METHOD_UNSPECIFIED = 0;
  METHOD_PING = 1;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INVALID_ARGUMENT = 1;
  ERROR_CODE_NOT_FOUND = 2;
  ERROR_CODE_BUSINESS_RULE = 3;
  ERROR_CODE_STORAGE = 4;
  ERROR_CODE_PANIC = 5;
}

enum ErrorSubCode {
  ERROR_SUB_CODE_UNSPECIFIED = 0;
  ERROR_SUB_CODE_DUPLICATE_NAME = 1;
  ERROR_SUB_CODE_TOO_MANY_FIELDS = 2;
  ERROR_SUB_CODE_MISSING_ROLE = 3;
}

enum EntityType {
  ENTITY_TYPE_UNSPECIFIED = 0;
  ENTITY_TYPE_FOLDER = 1;
  ENTITY_TYPE_DECK = 2;
  ENTITY_TYPE_NOTE = 3;
  ENTITY_TYPE_CARD = 4;
}

enum ChangeKind {
  CHANGE_KIND_UNSPECIFIED = 0;
  CHANGE_KIND_UPSERT = 1;
  CHANGE_KIND_DELETE = 2;
}

message Change {
  string entity_id = 1;
  ChangeKind kind = 2;
  EntityType entity = 3;
}

message ChangeSet {
  repeated Change changes = 1;
}

message Error {
  ErrorCode code = 1;
  ErrorSubCode sub_code = 2;
}
