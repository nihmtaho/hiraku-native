name: ci

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # One required check named "ci": the ruleset matches this job name.
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: 1.75.0
      - name: Go vet and race tests
        working-directory: core
        run: |
          go vet ./...
          go test -race -count=1 ./...
      - name: Core boundary checks
        run: |
          core/scripts/check-core.sh
          Scripts/check-imports.sh
      - name: Contract lint
        run: buf lint
      - name: Skill tests
        run: node --test .agents/hiraku/tests/*.test.mjs
      - name: ROADMAP and Kanban agree
        run: node .agents/skills/hiraku-wp-status/scripts/wp-status.mjs --check

  swift:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Xcode tests
        run: xcodebuild test -project App/Hiraku.xcodeproj -scheme Hiraku -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO
